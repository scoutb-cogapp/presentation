{% extends "base.html" %}

{% block title %}Contents{% endblock %}

{% block body %}
{% set slides = get_section(path="slides/_index.md") %}
<main class="slide slide-text">
  {{ <slide_header title="Contents" /> }}
  <div class="slide-content">
    <ol class="slide-contents-list">
      {% for slide in slides.pages %}
      {% if slide.permalink != page.permalink %}
      <li><a href="{{ slide.permalink }}">{{ slide.title }}</a></li>
      {% endif %}
      {% endfor %}
    </ol>
  </div>
  {{ <slide_nav prev_page={page.lower} next_page={page.higher} /> }}
</main>
{% endblock %}
