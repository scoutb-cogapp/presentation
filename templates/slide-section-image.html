{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block body %}
<main class="slide slide-section slide-hero">
  <div class="section-image-layout">
    <div class="section-body">
      <h1 class="section-title">{{ page.title }}</h1>
    </div>
    <img src="/{{ page.extra.image }}" alt="{{ page.extra.image_alt | default(value='') }}" class="section-image">
  </div>
  {{ <slide_nav prev_page={page.lower} next_page={page.higher} /> }}
</main>
{% endblock %}
