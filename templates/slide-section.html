{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block title %}{{ page.title }} — {{ config.extra.presentation_title }}{% endblock %}

{% block body %}
<main class="slide slide-section slide-hero">
  <div class="section-body">
    <p class="section-label">Section</p>
    <h1 class="section-title">{{ page.title }}</h1>
  </div>
  {{ macros::slide_nav(prev_page=page.lower, next_page=page.higher) }}
</main>
{% endblock %}
