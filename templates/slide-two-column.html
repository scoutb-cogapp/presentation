{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block body %}
<main class="slide slide-two-column">
  {{ <slide_header title={page.title} intro={page.extra.intro | default(value="")} /> }}
  <div class="slide-content two-column-layout">
    {{ page.content | safe }}
  </div>
  {{ <slide_nav prev_page={page.lower} next_page={page.higher} /> }}
</main>
{% endblock %}
